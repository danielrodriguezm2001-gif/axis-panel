<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Axis · Panel de salas</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F7F5; }
</style>
</head>
<body>
<div id="root">
  <p style="font-family: sans-serif; padding: 24px; color: #5A6B63;">Cargando el panel…</p>
</div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- Google Identity Services: necesario para el botón "Conectar con Google
     Calendar" de gcal.js. Sin esto, gcal.js se queda esperando para siempre. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Supabase (Caja de Axis: pagos en tiempo real) y su lógica; antes que panel.js, que la usa al pintar. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="caja.js?v=7"></script>
<!-- La Caja completa dentro del panel (misma base de datos y sesión): estilos y lógica de la pestaña «Caja». -->
<link rel="stylesheet" href="caja-app.css?v=1" />
<script src="caja-app.js?v=1" data-embebida></script>

<!-- El panel (horarios, sesiones, equipo...) -->
<script src="panel.js?v=44"></script>

<!-- Integración de Google Calendar: añade el widget flotante de "Conectar"
     y el autoenvío de invitaciones por coach. Va DESPUÉS de panel.js
     porque lee/escribe las mismas claves de localStorage que usa el panel. -->
<script src="gcal.js?v=4"></script>
</body>
</html>
